[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autocadinho"
version = "1.0.0"
description = "Desenhos simples de obra (vigas, pilares, medidas e textos) para salvar e imprimir"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.8,<7"]
keywords = ["planta", "obra", "desenho", "construção", "cad", "pyside6", "floor plan", "construction"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.urls]
Homepage = "https://github.com/edvitor13/autocadinho"
Releases = "https://github.com/edvitor13/autocadinho/releases"
Issues = "https://github.com/edvitor13/autocadinho/issues"

[project.gui-scripts]
autocadinho = "autocadinho.app:main"

[tool.setuptools.packages.find]
include = ["autocadinho*"]

[tool.setuptools.package-data]
autocadinho = ["locales/*.json"]
